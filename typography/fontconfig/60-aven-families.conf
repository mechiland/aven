<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Aven: Adwaita Sans UI with explicit regional Noto CJK fallbacks</description>

  <!-- Keep explicitly requested document families ahead of generic fallbacks. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Adwaita Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Adwaita Sans</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Sans Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- A distribution may already have inserted these families as weak generic aliases.
       Promote that existing entry, otherwise a later strong CJK fallback can
       win even for Latin. Earlier explicit document families stay ahead.
       Noto Sans aliases retain the matched binding: an earlier weak distro
       Noto default must not outrank the new strong Adwaita UI default. -->
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Adwaita Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono</string></edit>
  </match>

  <!-- Untagged Chinese uses SC. Later language rules insert immediately after
       the requested UI family, ahead of this default, while preserving Latin glyphs. -->
  <alias binding="strong">
    <family>Adwaita Sans</family>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias binding="same">
    <family>Noto Sans</family>
    <accept>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK HK</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
  <alias binding="strong">
    <family>Noto Sans Mono</family>
    <accept>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK HK</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>

  <!-- Fontconfig language tags use region tags. Applications must preserve
       document language; no font can infer the intended Han locale. -->
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK HK</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK HK</string></edit>
  </match>
  <!-- The full Noto collection includes JP/KR; do not give Japanese or Korean
       pages Chinese glyph forms merely because Aven focuses on Chinese. -->
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="same"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Noto Sans Mono</string></test>
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
  </match>
</fontconfig>
