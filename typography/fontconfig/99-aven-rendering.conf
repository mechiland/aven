<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Aven: grayscale antialiasing and slight vertical hinting</description>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <!-- Let FreeType choose native light hints where supported. -->
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="color" compare="not_eq"><bool>true</bool></test>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>Noto Sans</string></test>
    <edit name="embolden" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- Color emoji fonts can require bitmap strikes. Do not disable them. -->
  <match target="font">
    <test name="color"><bool>true</bool></test>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
